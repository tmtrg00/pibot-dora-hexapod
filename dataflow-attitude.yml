# Attitude graph. MOTION but no travel: the robot tilts on the spot.
#
# Checks that roll and pitch drive the axes they are named after. They did not
# until 2026-08-19 — calculate_posture_balance built its X rotation from the
# pitch argument and its Y rotation from the roll argument, so set_attitude
# swapped them and the tilted stances leaned sideways instead of forward.
#
# This one is settled by watching the robot, not by reading the log:
#   ROLL  should tip it side to side.
#   PITCH should tip it nose up and down.
#
#   ./run.sh attitude
#   PIBOT_ATTITUDE_ANGLE=15 PIBOT_ATTITUDE_HOLD=5 ./run.sh attitude

nodes:
  - id: hardware
    path: bin/py
    args: nodes/hardware_node.py
    inputs:
      tick: dora/timer/millis/500
      tool_call: attitude_test/tool_call
    outputs:
      - battery
      - health
      - tool_result

  - id: attitude_test
    path: bin/py
    args: nodes/attitude_test_node.py
    inputs:
      tick: dora/timer/millis/250
      tool_result: hardware/tool_result
      battery: hardware/battery
      health: hardware/health
    outputs:
      - tool_call
