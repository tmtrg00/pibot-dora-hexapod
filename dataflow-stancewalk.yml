# Stance-walk graph. LOCOMOTION: walks forward then backward in each named
# stance to exercise the footprint-carries-into-the-gait mechanism. Each
# stance+direction pair is pre-validated offline (frame-by-frame gait reach
# simulation) before anything moves; combinations that would go out of reach
# mid-stride are skipped with a log line.
#
#   ./run.sh stancewalk
#   PIBOT_STANCEWALK_STANCES=wide PIBOT_STANCEWALK_CYCLES=2 ./run.sh stancewalk

nodes:
  - id: hardware
    path: bin/py
    args: nodes/hardware_node.py
    inputs:
      tick: dora/timer/millis/1000
      tool_call: stance_walk/tool_call
    outputs:
      - battery
      - health
      - tool_result

  - id: stance_walk
    path: bin/py
    args: nodes/stance_walk_test_node.py
    inputs:
      tick: dora/timer/millis/250
      tool_result: hardware/tool_result
      battery: hardware/battery
    outputs:
      - tool_call
