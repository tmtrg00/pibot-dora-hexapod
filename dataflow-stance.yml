# Stance test graph. MOVES THE ROBOT (all six legs reposition per stance),
# but it never travels. Needs servo power and a level surface.
#
#   ./run.sh stance
#   PIBOT_STANCE_ONLY=wide ./run.sh stance

nodes:
  - id: hardware
    path: bin/py
    args: nodes/hardware_node.py
    inputs:
      tick: dora/timer/millis/1000
      tool_call: stance_test/tool_call
    outputs:
      - battery
      - health
      - tool_result

  - id: stance_test
    path: bin/py
    args: nodes/stance_test_node.py
    inputs:
      tick: dora/timer/millis/250
      tool_result: hardware/tool_result
      battery: hardware/battery
    outputs:
      - tool_call
