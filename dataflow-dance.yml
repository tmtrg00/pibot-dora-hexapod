# Dance test graph. MOVES THE ROBOT (body grooves over planted feet), but it
# never travels and no foot leaves the ground. Needs servo power and a
# charged pack.
#
#   ./run.sh dance
#   PIBOT_DANCE_REPEATS=2 PIBOT_DANCE_BEAT_S=0.6 ./run.sh dance

nodes:
  - id: hardware
    path: bin/py
    args: nodes/hardware_node.py
    inputs:
      tick: dora/timer/millis/1000
      tool_call: dance_test/tool_call
    outputs:
      - battery
      - health
      - tool_result

  - id: dance_test
    path: bin/py
    args: nodes/dance_test_node.py
    inputs:
      tick: dora/timer/millis/250
      tool_result: hardware/tool_result
      battery: hardware/battery
    outputs:
      - tool_call
