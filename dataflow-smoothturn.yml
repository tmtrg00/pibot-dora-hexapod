# Smooth-turn graph. LOCOMOTION: rotates in place, does not travel.
#
# Turning used to stutter because a strideless command was single-shot in
# condition_monitor, so a multi-cycle turn had to be driven from outside as a
# sequence of one-cycle commands. It now stays queued and runs continuously.
# This graph checks both halves of that: the smoothness is yours to judge by
# watching, the landing accuracy is settled by the log.
#
# Mark the robot's facing direction with tape before starting. Four 90deg turns
# should bring it back to that mark, and so should the two 180deg turns.
#
#   ./run.sh smoothturn
#   PIBOT_SMOOTHTURN_TOLERANCE=3 ./run.sh smoothturn    tighter landing
#   PIBOT_TURN_SPEED=8 ./run.sh smoothturn              faster gait

nodes:
  - id: hardware
    path: bin/py
    args: nodes/hardware_node.py
    inputs:
      tick: dora/timer/millis/1000
      tool_call: smooth_turn/tool_call
    outputs:
      - battery
      - health
      - tool_result

  - id: smooth_turn
    path: bin/py
    args: nodes/smooth_turn_test_node.py
    inputs:
      tick: dora/timer/millis/250
      tool_result: hardware/tool_result
      battery: hardware/battery
      health: hardware/health
    outputs:
      - tool_call
